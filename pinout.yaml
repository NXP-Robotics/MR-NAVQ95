  # ------------------------------------------------------------------ IO expansion board
  - ref: J1
    board: io
    name: CONSOLE
    cat: usb
    function: "USB-C console: CP2105 bridge, UART1 = Linux, UART2 = M7"
    type: "USB Type-C receptacle (USB 2.0 device)"
    source: "SPF-97013_A1-IO.pdf p7"
    path: [{name: "CP2105", role: "USB to dual UART bridge"}]
    layout: summary
    section: true
    notes: >
      A Silicon Labs CP2105 gives two serial ports on one USB-C connection. On a Linux host they
      appear as ttyUSB0 (UART1, Linux console) and ttyUSB1 (UART2, M7 console). RX and TX LEDs for
      both UARTs sit next to the connector. The same two UARTs also go to the J2 header on the main
      board, see the figure below.
    alerts:
      - {type: note, text: "Port 1 (ECI) is the Linux console, port 2 (SCI) is the M7 console. Do not let the host drive the TX lines while the board resets."}

  - ref: J6
    board: io
    name: TELEM
    cat: uart
    function: "Telemetry UART7 with flow control"
    type: "JST-GH 1x6, top entry"
    standard: "DS-009 TELEM"
    source: "SPF-97013_A1-IO.pdf p5"
    level: "3.3 V logic"
    path: []
    verified: true
    layout: single
    notes: >
      The 5 V output is filtered (VDD_CON_UART_5V0) and has ESD protection.
    pins:
      - {n: 1, net: VDD_CON_UART_5V0, cat: 5v,   label: "5V out"}
      - {n: 2, net: UART7_TX,         cat: uart, label: "UART7 TX", pad: "GPIO_IO08"}
      - {n: 3, net: UART7_RX,         cat: uart, label: "UART7 RX", pad: "GPIO_IO09"}
      - {n: 4, net: UART7_CTS_B,      cat: uart, label: "UART7 CTS", pad: "GPIO_IO10"}
      - {n: 5, net: UART7_RTS_B,      cat: uart, label: "UART7 RTS", pad: "GPIO_IO11"}
      - {n: 6, net: GND,              cat: gnd}

  - ref: J8
    board: io
    name: GPS
    cat: uart
    function: "GPS: UART5, I2C6, safety switch, LED, buzzer"
    type: "JST-GH 1x10, side entry"
    standard: "DS-009 GPS"
    source: "SPF-97013_A1-IO.pdf p5"
    level: "3.3 V logic"
    path: []
    verified: true
    layout: single
    notes: >
      Standard DS-009 GPS and compass connector. The safety switch input (ARM_IO) is also wired to
      the ARM button SW1 on the board, and the LED output drives the LED in the switch. The buzzer pin
      is switched by an N-FET (AO3400A) driven from TPM6_CH1. A buzzer on the board is connected in
      parallel. DIP switch S1 sits between TPM6_CH1 and the FET: with S1 OFF both buzzers are
      disconnected and TPM6_CH1 is free for PWM8 on the PWM header.
    pins:
      - {n: 1,  net: VDD_CON_GPS_5V0, cat: 5v,   label: "5V out"}
      - {n: 2,  net: UART5_TX,        cat: uart, label: "UART5 TX", pad: "GPIO_IO00"}
      - {n: 3,  net: UART5_RX,        cat: uart, label: "UART5 RX", pad: "GPIO_IO01"}
      - {n: 4,  net: I2C6_SCL,        cat: i2c,  label: "I2C6 SCL", pad: "GPIO_IO03"}
      - {n: 5,  net: I2C6_SDA,        cat: i2c,  label: "I2C6 SDA", pad: "GPIO_IO02"}
      - {n: 6,  net: ARM_IO,          cat: gpio, label: "Safety switch", pad: "GPIO_IO07"}
      - {n: 7,  net: SW_LED_OUT,      cat: gpio, label: "Safety LED", via: "PCAL6416 expander", pad: "I2C4 (GPIO_IO30/31)"}
      - {n: 8,  net: VDD_CON_GPS_3V3, cat: 3v3,  label: "3.3V out"}
      - {n: 9,  net: BUZZER,          cat: pwm,  label: "Buzzer", via: "FET Q2", pad: "GPIO_IO23", note: "enabled by DIP switch S1"}
      - {n: 10, net: GND,             cat: gnd}

  - ref: J7
    board: io
    name: I2C
    cat: i2c
    function: "I2C6 peripheral connector"
    type: "JST-GH 1x4, top entry"
    standard: "DS-009 I2C"
    source: "SPF-97013_A1-IO.pdf p5"
    level: "3.3 V logic"
    path: []
    verified: true
    layout: single
    notes: >
      Same I2C6 bus as the GPS connector.
    pins:
      - {n: 1, net: VDD_CON_I2C_5V0, cat: 5v,  label: "5V out"}
      - {n: 2, net: I2C6_SCL,        cat: i2c, label: "I2C6 SCL", pad: "GPIO_IO03"}
      - {n: 3, net: I2C6_SDA,        cat: i2c, label: "I2C6 SDA", pad: "GPIO_IO02"}
      - {n: 4, net: GND,             cat: gnd}

  - ref: J9
    board: io
    name: PWM
    cat: pwm
    function: "8x PWM / timer outputs (TPM3 to TPM6), also usable as FlexIO1 pins"
    type: "JST-GH 1x10, side entry"
    source: "SPF-97013_A1-IO.pdf p5"
    level: "3.3 V logic outputs"
    path: []
    verified: true
    layout: single
    notes: >
      Pin 1 (VDD_CON_PWM) is the servo power rail. It is linked to the board 5 V through R60 (0 Ω,
      not fitted) and measured on ADC_IN6 (VDD_CON_PWM / 8, up to 12 V). The outputs are 3.3 V logic
      with ESD protection. PWM8 (pin 9) also drives the buzzer. Every output pad can
      also be muxed to FlexIO1, for example for DShot or other custom timing protocols. Pins 2 and
      5 can also be CAN4 or LPUART6 (TX and RX), pins 8 and 9 CAN5 or LPI2C5 (no pull-ups on the
      board). CAN4 and CAN5 need an external transceiver.
    alerts:
      - {type: warning, text: "Do not put more than 5 V on the servo rail (pin 1) while R60 is fitted."}
      - {type: tip, text: "Need all eight PWM outputs? Switch DIP switch S1 (BUZZER) off. It frees PWM8 from the buzzer."}
    pins:
      - {n: 1,  net: VDD_CON_PWM, cat: 5v,  label: "Servo rail", note: "measured on ADC_IN6", pad: "ADC_IN6"}
      - {n: 2,  net: TPM3_CH0,    cat: pwm, label: "PWM1", pad: "GPIO_IO04", alt: [FLEXIO1_FLEXIO4, CAN4_TX, LPUART6_TX]}
      - {n: 3,  net: TPM3_CH1,    cat: pwm, label: "PWM2", pad: "GPIO_IO20", alt: FLEXIO1_FLEXIO20}
      - {n: 4,  net: TPM3_CH3,    cat: pwm, label: "PWM3", pad: "GPIO_IO24", alt: FLEXIO1_FLEXIO24}
      - {n: 5,  net: TPM4_CH0,    cat: pwm, label: "PWM4", pad: "GPIO_IO05", alt: [FLEXIO1_FLEXIO5, CAN4_RX, LPUART6_RX]}
      - {n: 6,  net: TPM4_CH1,    cat: pwm, label: "PWM5", pad: "GPIO_IO21", alt: FLEXIO1_FLEXIO21}
      - {n: 7,  net: TPM5_CH0,    cat: pwm, label: "PWM6", pad: "GPIO_IO06", alt: FLEXIO1_FLEXIO6}
      - {n: 8,  net: TPM5_CH1,    cat: pwm, label: "PWM7", pad: "GPIO_IO22", alt: [FLEXIO1_FLEXIO22, CAN5_TX, LPI2C5_SDA]}
      - {n: 9,  net: TPM6_CH1,    cat: pwm, label: "PWM8", note: "shared with the buzzer while S1 is ON", pad: "GPIO_IO23", alt: [FLEXIO1_FLEXIO23, CAN5_RX, LPI2C5_SCL]}
      - {n: 10, net: GND,         cat: gnd}

  - ref: J5
    board: io
    name: CAN1
    cat: can
    function: "CAN FD 1 (TJA1463)"
    type: "JST-GH 1x4, side entry"
    standard: "DS-009 CAN"
    source: "SPF-97013_A1-IO.pdf p4"
    bridge:
      name: TJA1463
      role: "CAN FD transceiver"
      map:
        - {net: CAN1_H, port_in: CANH, port_out: TXD, label: "CAN1 TX", pad: PDM_CLK}
        - {net: CAN1_L, port_in: CANL, port_out: RXD, label: "CAN1 RX", pad: PDM_BIT_STREAM0}
    flags: ["120 Ω termination: fitted"]
    verified: true
    layout: single
    notes: >
      TJA1463 CAN FD transceiver with 5 V supply. The 120 Ω split termination is on the board, so each
      CAN port is a bus end. CANH and CANL together form the differential bus. TXD and RXD are the
      logic pins of the transceiver and go to the FlexCAN pads of the i.MX95. The transceiver enable
      and standby pins are controlled through the PCAL6524 I/O expander.
    pins:
      - {n: 1, net: CON_CAN1_5V0, cat: 5v,  label: "5V out"}
      - {n: 2, net: CAN1_H,       cat: can, label: "CAN1 H"}
      - {n: 3, net: CAN1_L,       cat: can, label: "CAN1 L"}
      - {n: 4, net: GND,          cat: gnd}

