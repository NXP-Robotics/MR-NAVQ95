      Bridge-tied class-D outputs of the WM8962B codec. The 4-pin JST-PH
      plug of the [Adafruit 1669 Stereo Enclosed Speaker Set](https://www.adafruit.com/product/1669)
      (2x 3 W, 4 Ω) fits directly. J25 next to it is the headset jack; the board also has two PDM
      microphones.
    alerts:
      - {type: caution, text: "No GND on this connector. Each speaker goes between its − and + pin. Never connect a speaker pin to ground."}
    pins:
      - {n: 1, net: SPKOUTLN, cat: audio, label: "Left −", note: "not GND", pad: "WM8962 codec"}
      - {n: 2, net: SPKOUTLP, cat: audio, label: "Left +", pad: "WM8962 codec"}
      - {n: 3, net: SPKOUTRN, cat: audio, label: "Right −", note: "not GND", pad: "WM8962 codec"}
      - {n: 4, net: SPKOUTRP, cat: audio, label: "Right +", pad: "WM8962 codec"}

  # ------------------------------------------------------------------ camera expansion board
  - ref: J3
    board: cam
    name: CSI
    cat: mipi
    function: "MIPI CSI-2 camera, 4 data lanes, RPi camera compatible"
    type: "22-pin 0.5 mm FPC/FFC, contacts away from the PCB"
    standard: "RPi 22-pin CSI layout"
    level: "1.2 V MIPI, 3.3 V I2C and GPIO"
    source: "SPF-97012_A1-CAMRP.pdf p3"
    verified: true
    layout: single
    path: [{name: "IP4292", role: "MIPI ESD arrays"}, {name: "PCA9306", role: "I2C level shifter"}]
    flags: ["RPi camera modules fit (22-pin FFC)", "RPi DSI displays: DSICSI_B2B port only"]
    notes: >
      Pin-compatible with the 22-pin RPi camera connector (22-pin 0.5 mm same-side FFC). Two
      identical camera boards can be fitted. In the bottom view, the left one sits on CSI_B2B and
      goes to the i.MX95 MIPI_CSI1 port; the right one sits on DSICSI_B2B and goes to the second
      port, which is shared between DSI and CSI. The camera I2C is the i.MX95 I3C2 bus, shifted
      from 1.8 V to 3.3 V by a PCA9306. The two GPIO pins come from the I/O expander on the main
      board; the exact expander pins and the pad names of the second port were not traced. Whether a
      camera module works depends on the software image, not on the connector. J4 next to it is a
      3-pin 5 V header for a display, not fitted.
    alerts:
      - {type: tip, text: "RPi camera modules fit directly with a standard 22-pin FFC. For an RPi DSI display use the camera board on the DSICSI_B2B port; the CSI_B2B port cannot drive a display."}
    pins:
      - {n: 1,  net: GND,            cat: gnd}
      - {n: 2,  net: MIPI_CSI_D0_N,  cat: mipi, label: "CSI D0 −", pad: MIPI_CSI1_D0_N}
      - {n: 3,  net: MIPI_CSI_D0_P,  cat: mipi, label: "CSI D0 +", pad: MIPI_CSI1_D0_P}
      - {n: 4,  net: GND,            cat: gnd}
      - {n: 5,  net: MIPI_CSI_D1_N,  cat: mipi, label: "CSI D1 −", pad: MIPI_CSI1_D1_N}
      - {n: 6,  net: MIPI_CSI_D1_P,  cat: mipi, label: "CSI D1 +", pad: MIPI_CSI1_D1_P}
      - {n: 7,  net: GND,            cat: gnd}
      - {n: 8,  net: MIPI_CSI_CLK_N, cat: mipi, label: "CSI CLK −", pad: MIPI_CSI1_CLK_N}
      - {n: 9,  net: MIPI_CSI_CLK_P, cat: mipi, label: "CSI CLK +", pad: MIPI_CSI1_CLK_P}
      - {n: 10, net: GND,            cat: gnd}
      - {n: 11, net: MIPI_CSI_D2_N,  cat: mipi, label: "CSI D2 −", pad: MIPI_CSI1_D2_N}
      - {n: 12, net: MIPI_CSI_D2_P,  cat: mipi, label: "CSI D2 +", pad: MIPI_CSI1_D2_P}
      - {n: 13, net: GND,            cat: gnd}
      - {n: 14, net: MIPI_CSI_D3_N,  cat: mipi, label: "CSI D3 −", pad: MIPI_CSI1_D3_N}
      - {n: 15, net: MIPI_CSI_D3_P,  cat: mipi, label: "CSI D3 +", pad: MIPI_CSI1_D3_P}
      - {n: 16, net: GND,            cat: gnd}
      - {n: 17, net: CAM1_IO1_CON,   cat: gpio, label: "Camera GPIO 1", via: "I/O expander"}
      - {n: 18, net: CAM1_IO2_CON,   cat: gpio, label: "Camera GPIO 2", via: "I/O expander"}
      - {n: 19, net: GND,            cat: gnd}
      - {n: 20, net: SCL_3V3_CON,    cat: i2c,  label: "I2C SCL", via: "PCA9306", pad: I3C2_SCL}
      - {n: 21, net: SDA_3V3_CON,    cat: i2c,  label: "I2C SDA", via: "PCA9306", pad: I3C2_SDA}
      - {n: 22, net: VDD_CON_3V3,    cat: 3v3,  label: "3.3V out"}

