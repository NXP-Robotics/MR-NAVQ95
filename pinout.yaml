connectors:
  # ------------------------------------------------------------------ main board
  - ref: J9
    board: main
    name: PWR_IN
    cat: vin
    function: "Power input 9-52 V (3S-12S battery)"
    type: "Molex Micro-Fit 3.0 2-pin (0430450222)"
    source: "SPF-97010_A1-MAIN.pdf p5"
    verified: true
    layout: single
    notes: >
      Pin 1 (BATT +) is the lower pin on the board. Input 9 to 52 V, never more than 60 V. The
      board can draw 60 W between 9 and 20 V, and 125 W between 20 and 52 V. The input voltage is
      measured on ADC_IN0 (VIN / 64).
    pins:
      - {n: 1, net: VDD_BAT, cat: vin, label: "BATT +"}
      - {n: 2, net: GND,     cat: gnd, label: "BATT -"}

  - ref: J2
    board: main
    name: CONSOLE
    cat: uart
    function: "UART1 (Linux console) and UART2 (M7 console) header, DS-009 TELEM layout"
    type: "JST-GH 1x6 (SM06B-GHS-TB)"
    standard: "DS-009 TELEM"
    source: "SPF-97010_A1-MAIN.pdf p10"
    level: "3.3 V logic"
    path: []
    verified: true
    layout: single
    notes: >
      Pins 2 to 5 follow the DS-009 TELEM layout for UART1: 2 = TX, 3 = RX, 4 = CTS, 5 = RTS.
      By default pin 4 carries UART2 RX and pin 5 UART2 TX (the M7 console). The same pads can be
      muxed to UART1 CTS and RTS instead, which gives UART1 full DS-009 flow control on this
      header. UART1 TX and UART2 TX are also the boot-mode
      straps BT_MODE0 and BT_MODE1. The same two UARTs are also on the USB console port J10 of the
      IO board, see the figure there.
    alerts:
      - {type: note, text: "UART1 TX and UART2 TX are boot straps. Keep them idle while the board resets, or it may boot from the wrong source."}
    pins:
      - {n: 1, net: VDD_SYS_5V0,        cat: 5v,   label: "5V out"}
      - {n: 2, net: UART1_TXD/BT_MODE0, cat: uart, label: "UART1 TX", note: "Linux console; boot strap BT_MODE0", pad: "UART1_TXD"}
      - {n: 3, net: UART1_RXD,          cat: uart, label: "UART1 RX", pad: "UART1_RXD"}
      - {n: 4, net: UART2_RXD,          cat: uart, label: "UART2 RX", note: "M7 console by default; the pad can be muxed to UART1 CTS", pad: "UART2_RXD", alt: [LPUART1_CTS_B]}
      - {n: 5, net: UART2_TXD/BT_MODE1, cat: uart, label: "UART2 TX", note: "M7 console by default; the pad can be muxed to UART1 RTS; boot strap BT_MODE1", pad: "UART2_TXD", alt: [LPUART1_RTS_B]}
      - {n: 6, net: GND,                cat: gnd}

  - ref: J7
    board: main
    name: DEBUG
    cat: debug
    function: "SWD / JTAG debug header (Arm Cortex 10-pin)"
    type: "2x5 1.27 mm (Samtec SHF-105-01-L-D-RA)"
    standard: "Arm Cortex 10-pin debug"
    source: "SPF-97010_A1-MAIN.pdf p10"
    level: "1.8 V logic (VTref)"
    path: []
    verified: true
    layout: dual
    notes: >
      Standard Arm Cortex 10-pin layout (0.05 inch). Works with J-Link, PyOCD, CMSIS-DAP and
      similar probes. nRESET goes through a diode to SYS_RST_B, so the probe can only pull it low.
    alerts:
      - {type: note, text: "VTref is 1.8 V. Use a debug probe that supports 1.8 V targets."}
    pins:
      - {n: 1,  net: VDD_1V8,             cat: 3v3,   label: "VTref 1.8V"}
      - {n: 2,  net: DEBUG_TMS_SWDIO,     cat: debug, label: "SWDIO / TMS", pad: "DAP_TMS_SWDIO"}
      - {n: 3,  net: GND,                 cat: gnd}
      - {n: 4,  net: DEBUG_TCLK_SWCLK,    cat: debug, label: "SWCLK / TCK", pad: "DAP_TCLK_SWCLK"}
      - {n: 5,  net: GND,                 cat: gnd}
      - {n: 6,  net: DEBUG_TDO_TRACESWO,  cat: debug, label: "SWO / TDO", pad: "DAP_TDO_TRACESWO"}
      - {n: 7,  net: GND,                 cat: nc,    label: "Key", note: "tied to GND"}
      - {n: 8,  net: DEBUG_TDI,           cat: debug, label: "TDI", pad: "DAP_TDI"}
      - {n: 9,  net: GND,                 cat: gnd,   label: "GNDDetect"}
      - {n: 10, net: SYS_RST_B,           cat: gpio,  label: "nRESET", note: "open drain", via: "PF09 PMIC", pad: "POR_B"}

  - ref: J13
    board: main
    name: USB1
    cat: usb
    function: "USB 3.0 Type-C, serial download / device port"
    type: "USB Type-C receptacle, bottom side"
    source: "SPF-97010_A1-MAIN.pdf p15"
    layout: summary
    summary: "Serial-download port of the i.MX95 boot ROM and the port the NavQ95 flasher uses. USB 3.0 and USB 2.0 are both connected."

  - ref: J12
    board: main
    name: USB2
    cat: usb
    function: "USB 2.0 Type-C host port"
    type: "USB Type-C receptacle, bottom side"
    source: "SPF-97010_A1-MAIN.pdf p16"
    layout: summary
    summary: "Host port. 5 V VBUS through an NX20P0477 load switch with over-current protection."

  - ref: J8
    board: main
    name: ENET1
    cat: eth
    function: "Gigabit Ethernet with PTP"
    type: "RJ45 with magnetics (Abracon ARJM11D7)"
    source: "SPF-97010_A1-MAIN.pdf p20"
    layout: summary
    summary: "RTL8211 PHY on i.MX95 ENET1, supports IEEE 1588 PTP."

  - ref: J6
    board: main
    name: MICROSD
    cat: gpio
    function: "microSD card slot (USDHC2)"
    type: "microSD push-push, bottom side"
    source: "SPF-97010_A1-MAIN.pdf p13"
    layout: summary
    summary: "USDHC2. The board can boot from it when the boot-mode switch selects SD."

  - ref: J1
    board: main
    name: M.2 KEY M
    cat: pcie
    function: "M.2 Key M slot, PCIe x1 (NPU or NVMe SSD)"
    type: "M.2 Socket 3 Key M, 2242 / 2280 standoffs, 3.3 V up to 3.5 A"
    level: "SMBus 1.8 V logic"
    source: "SPF-97010_A1-MAIN.pdf p21"
    verified: true
    layout: single
    path: [{name: "PI6C clock buffer", role: "100 MHz REFCLK"}, {name: "PCAL6524", role: "I/O expander (control pins)"}]
    flags: ["PCIe x1: lane 0 only", "No SATA"]
    notes: >
      Only the pins below are connected. All other pins of the 75-pin socket are not used: PCIe lanes
      1 to 3 (odd pins 5 to 37), SATA, DEVSLP, SUSCLK (pin 68, link resistor not fitted), MFG1/2 and the
      even pins 6 to 36. The 3.3 V comes through an NX20P5090 load switch that the I/O expander can
      switch off: 3.5 A continuous, 7 A peaks of 100 µs.
    alerts:
      - {type: note, text: "PCIe x1 only, no SATA. An NVMe SSD or NPU module works; a SATA M.2 drive does not."}
    pins:
      - {n: 3V3, net: VDD_3V3_M2_KEYM,    cat: 3v3,  label: "3.3 V ×9",  note: "pins 2, 4, 12, 14, 16, 18, 70, 72, 74"}
      - {n: GND, net: GND,                cat: gnd,  label: "GND ×11",   note: "pins 3, 9, 15, 27, 33, 39, 45, 51, 57, 71, 73"}
      - {n: 10,  net: LED_GRN,            cat: gpio, label: "Activity LED", tag: "drives the KEY_M_ACT LED"}
      - {n: 40,  net: M2_SMBUS_CLK,       cat: i2c,  label: "SMBus CLK",  via: "P3H2840 I3C hub"}
      - {n: 41,  net: PCIE1_RX0_N,        cat: pcie, label: "PCIe RX0 −", pad: PCIE1_RX0_N}
      - {n: 42,  net: M2_SMBUS_DATA,      cat: i2c,  label: "SMBus DATA", via: "P3H2840 I3C hub"}
      - {n: 43,  net: PCIE1_RX0_P,        cat: pcie, label: "PCIe RX0 +", pad: PCIE1_RX0_P}
      - {n: 44,  net: M2_SMBUS_ALERT_B,   cat: i2c,  label: "SMBus ALERT#", via: "P3H2840 I3C hub"}
      - {n: 47,  net: PCIE1_TX0_N,        cat: pcie, label: "PCIe TX0 −", pad: PCIE1_TX0_N}
      - {n: 49,  net: PCIE1_TX0_P,        cat: pcie, label: "PCIe TX0 +", pad: PCIE1_TX0_P}
      - {n: 50,  net: M2_KEYM_PERST_B,    cat: gpio, label: "PERST#",     via: "PCAL6524"}
      - {n: 52,  net: M2_KEYM_CLKREQ_B,   cat: gpio, label: "CLKREQ#",    via: "clock buffer"}
      - {n: 53,  net: M2_KEYM_REFCLK_N,   cat: pcie, label: "REFCLK −",   via: "clock buffer", tag: "100 MHz"}
      - {n: 54,  net: M2_KEYM_PEWAKE_B,   cat: gpio, label: "PEWAKE#",    via: "PCAL6524"}
      - {n: 55,  net: M2_KEYM_REFCLK_P,   cat: pcie, label: "REFCLK +",   via: "clock buffer", tag: "100 MHz"}
      - {n: 69,  net: M2_KEYM_PEDET,      cat: gpio, label: "PEDET (card detect)", via: "PCAL6524"}

  - ref: J16
    board: main
    name: M.2 KEY B
    cat: pcie
    function: "M.2 Key B slot, PCIe x1 with SIM (cellular modem)"
    type: "M.2 Socket 2 Key B / B+M, 2242 / 3042 / 3052 standoffs, bottom side, 3.3 V up to 5 A"
    level: "GPIO, RESET# and SMBus 1.8 V logic"
    source: "SPF-97010_A1-MAIN.pdf p22"
    verified: true
    layout: single
    path: [{name: "PI6C clock buffer", role: "100 MHz REFCLK"}, {name: "PCAL6524", role: "I/O expander (control pins)"}]
    flags: ["PCIe x1: lane 0 only", "No USB: modem must be a PCIe model"]
    notes: >
      Made for a PCIe cellular modem. The USB 2.0 pins (7, 9) and the USB 3.0 / lane 1 pins (29 to 37)
      are not connected. SMBus (40, 42, 44), SUSCLK (68)
      and the Bluetooth coexistence lines COEX1/2 (64, 62, to the IW612) are routed, but their link
      resistors are not fitted. ANTCTL0 to 3, COEX3, DPR, DEVSLP, GPIO_3/4/8 and MFG1/2 are not
      connected. The UIM pins go to the SIM holder J5. The 3.3 V comes through an NX20P5090 load
      switch that the I/O expander can switch off: 5 A continuous, 6 A peaks of 100 µs.
    alerts:
      - {type: important, text: "Buying a 4G or 5G modem? Get one that runs over PCIe. This slot has no USB pins, so a USB modem stays silent. Many modems exist in a USB and a PCIe version with the same name: check the exact SKU or the manual."}
    pins:
      - {n: 3V3, net: VDD_3V3_M2_KEYB,     cat: 3v3,  label: "3.3 V ×5",  note: "pins 2, 4, 70, 72, 74"}
      - {n: GND, net: GND,                 cat: gnd,  label: "GND ×11",   note: "pins 3, 5, 11, 27, 33, 39, 45, 51, 57, 71, 73"}
      - {n: 1,   net: M2_KEYB_CONFIG3,     cat: gpio, label: "CONFIG_3",  via: "PCAL6524"}
      - {n: 6,   net: M2_KEYB_FCPO_B,      cat: gpio, label: "FCPO#", via: "PCAL6524", tag: "full card power off"}
      - {n: 8,   net: M2_KEYB_WDISABLE1_B, cat: gpio, label: "W_DISABLE1#", via: "PCAL6524"}
      - {n: 10,  net: LED_GRN,             cat: gpio, label: "Activity LED", tag: "drives the KEY_B_ACT LED"}
      - {n: 20,  net: M2_KEYB_GPIO5,       cat: gpio, label: "GPIO_5",    via: "PCAL6524"}
      - {n: 21,  net: M2_KEYB_CONFIG0,     cat: gpio, label: "CONFIG_0",  via: "PCAL6524"}
      - {n: 22,  net: M2_KEYB_GPIO6,       cat: gpio, label: "GPIO_6",    via: "PCAL6524"}
      - {n: 23,  net: M2_KEYB_WOWWAN_B,    cat: gpio, label: "WAKE#", via: "PCAL6524", tag: "wake on WWAN"}
      - {n: 24,  net: M2_KEYB_GPIO7,       cat: gpio, label: "GPIO_7",    via: "PCAL6524"}
      - {n: 26,  net: M2_KEYB_WDISABLE2_B, cat: gpio, label: "W_DISABLE2#", via: "PCAL6524"}
      - {n: 30,  net: UIM_RESET,           cat: gpio, label: "SIM RST",   via: "SIM holder J5"}
      - {n: 32,  net: UIM_CLK,             cat: gpio, label: "SIM CLK",   via: "SIM holder J5"}
      - {n: 34,  net: UIM_DATA,            cat: gpio, label: "SIM I/O",   via: "SIM holder J5"}
      - {n: 36,  net: UIM_PWR,             cat: 3v3,  label: "SIM VCC",   via: "SIM holder J5", tag: "supplied by the module"}
      - {n: 41,  net: PCIE2_RX0_N,         cat: pcie, label: "PCIe RX0 −", pad: PCIE2_RX0_N}
      - {n: 43,  net: PCIE2_RX0_P,         cat: pcie, label: "PCIe RX0 +", pad: PCIE2_RX0_P}
      - {n: 47,  net: PCIE2_TX0_N,         cat: pcie, label: "PCIe TX0 −", pad: PCIE2_TX0_N}
      - {n: 49,  net: PCIE2_TX0_P,         cat: pcie, label: "PCIe TX0 +", pad: PCIE2_TX0_P}
      - {n: 50,  net: M2_KEYB_PERST_B,     cat: gpio, label: "PERST#",    via: "PCAL6524"}
      - {n: 52,  net: M2_KEYB_CLKREQ_B,    cat: gpio, label: "CLKREQ#",   via: "clock buffer"}
      - {n: 53,  net: M2_KEYB_REFCLK_N,    cat: pcie, label: "REFCLK −",  via: "clock buffer", tag: "100 MHz"}
      - {n: 54,  net: M2_KEYB_PEWAKE_B,    cat: gpio, label: "PEWAKE#",   via: "PCAL6524"}
      - {n: 55,  net: M2_KEYB_REFCLK_P,    cat: pcie, label: "REFCLK +",  via: "clock buffer", tag: "100 MHz"}
      - {n: 66,  net: SIM_DETECT,          cat: gpio, label: "SIM_DETECT", via: "SIM holder J5"}
      - {n: 67,  net: M2_KEYB_RESET_B,     cat: gpio, label: "RESET#",    via: "PCAL6524"}
      - {n: 69,  net: M2_KEYB_CONFIG1,     cat: gpio, label: "CONFIG_1",  via: "PCAL6524"}
      - {n: 75,  net: M2_KEYB_CONFIG2,     cat: gpio, label: "CONFIG_2",  via: "PCAL6524"}

  - ref: J5
    board: main
    name: SIM
    cat: gpio
    function: "SIM card holder for the Key B modem slot"
    type: "SIM card holder, 6 contacts + card-detect switch, bottom side"
    source: "SPF-97010_A1-MAIN.pdf p22"
    verified: true
    layout: single
    path: [{name: "M.2 Key B J16", role: "UIM pins 30-36, 66"}]
    notes: >
      Connected directly to the UIM pins of the Key B slot. The modem supplies the SIM voltage on
      UIM_PWR. The card-detect switch pulls SIM_DETECT low when a card is inserted. All contacts have
      ESD protection.
    pins:
      - {n: C1, net: UIM_PWR,    cat: 3v3,  label: "VCC", note: "from the module"}
      - {n: C2, net: UIM_RESET,  cat: gpio, label: "RST"}
      - {n: C3, net: UIM_CLK,    cat: gpio, label: "CLK"}
      - {n: C5, net: GND,        cat: gnd}
      - {n: C6, net: NC,         cat: nc,   label: "VPP"}
      - {n: C7, net: UIM_DATA,   cat: gpio, label: "I/O"}
      - {n: CD, net: SIM_DETECT, cat: gpio, label: "Card detect", note: "closes to GND"}

