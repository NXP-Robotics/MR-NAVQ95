  - ref: J12
    board: io
    name: AUDIO
    cat: audio
    function: "3.5 mm headset jack, CTIA wiring (WM8962B headphone out + microphone in)"
    type: "3.5 mm 4-pole TRRS jack with insertion switch, board underside"
    standard: "CTIA / AHJ (tip L, ring 1 R, ring 2 GND, sleeve MIC)"
    source: "SPF-97013_A1-IO.pdf p6"
    verified: true
    layout: plug
    path: [{name: "WM8962B", role: "audio codec (SAI2 + I2C4)"}]
    notes: >
      Plug contacts listed from tip to sleeve. The switch in the jack drives HP_JD: high with a plug inserted, low without. The codec uses it to detect the plug. The headphone ground reference is the HP_FB sense
      line of the codec.
    alerts:
      - {type: note, text: "CTIA wiring only. OMTP headsets (microphone and ground swapped) do not work."}
    pins:
      - {n: T,  net: HP_J_L,   cat: audio, label: "Left (tip)",       via: "WM8962B HPOUTL"}
      - {n: R1, net: HP_J_R,   cat: audio, label: "Right (ring 1)",   via: "WM8962B HPOUTR"}
      - {n: R2, net: GND,      cat: gnd,   label: "GND (ring 2)"}
      - {n: S,  net: HP_MICIN, cat: audio, label: "Microphone (sleeve)", via: "WM8962B IN1L", note: "bias voltage comes from the codec"}
      - {n: SW, net: HP_J_D,   cat: gpio,  label: "Insert detect",    via: "WM8962B GPIO3 (HP_JD)"}

  - ref: J2
    board: io
    name: SPKR
    cat: audio
    function: "Stereo speaker output (WM8962B class-D, 2x 1 W)"
    type: "JST-PH 2.0 mm 1x4"
    source: "SPF-97013_A1-IO.pdf p6"
